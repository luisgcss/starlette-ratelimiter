[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asgi-ratelimiter"
version = "0.1.0"
description = "Modular ASGI rate limiting for FastAPI and Starlette"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
authors = [
    { name = "luisgcss" },
]
keywords = [
    "rate-limiter",
    "rate-limiting",
    "asgi",
    "fastapi",
    "starlette",
    "async",
    "middleware",
    "throttling",
    "api",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "loguru>=0.7",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.140"]
starlette = ["starlette>=0.40"]
sqlite = []
redis = ["redis>=5.0"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.14",
    "fastapi>=0.115",
    "starlette>=0.40",
    "httpx2>=2.9.1",
]

[project.urls]
Homepage = "https://github.com/luisgcss/asgi-ratelimiter"
Repository = "https://github.com/luisgcss/asgi-ratelimiter"
Issues = "https://github.com/luisgcss/asgi-ratelimiter/issues"
Changelog = "https://github.com/luisgcss/asgi-ratelimiter/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/asgi_ratelimiter"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/.agents",
    "/skills-lock.json",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
]

[tool.ruff.lint.isort]
known-first-party = ["asgi_ratelimiter"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--cov=asgi_ratelimiter",
    "--cov-report=term-missing",
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.coverage.run]
source = ["src/asgi_ratelimiter"]
branch = true
omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
